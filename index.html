<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ธรรมศาสตร์และการเดินทาง</title>
  <!-- Bootstrap: ช่วยจัดวางปุ่ม ฟอร์ม และ responsive layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS: รูปแบบพื้นฐานของแผนที่และ popup -->
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <!-- CSS ของโปรเจกต์นี้: ปรับสี หมุด และ layout ได้ในไฟล์ style.css -->
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- ส่วนหัวเว็บ: โลโก้ ชื่อเว็บไซต์ ช่องค้นหา และปุ่ม GPS -->
  <header class="app-header">
    <a class="brand" href="#" aria-label="ธรรมศาสตร์และการเดินทาง หน้าหลัก">
      <span class="brand-mark" aria-hidden="true">มธ.</span>
      <span><strong>ธรรมศาสตร์และการเดินทาง</strong><small>แผนที่จุดวินมอเตอร์ไซค์และท่ารถตู้ · ศูนย์รังสิต</small></span>
    </a>
    <form id="searchForm" class="search-wrap" role="search">
      <span aria-hidden="true" class="search-icon">⌕</span>
      <input id="searchInput" type="search" class="form-control" placeholder="ค้นหาสถานที่ เช่น ตึก SC, กรีนแคนทีน…" autocomplete="off" aria-label="ค้นหาสถานที่">
      <button class="clear-search" id="clearSearch" type="button" aria-label="ล้างคำค้น" hidden>×</button>
    </form>
    <!-- สวิตช์สลับธีม: ดวงอาทิตย์แทนธีมสว่าง และดวงจันทร์แทนธีมมืด -->
    <button id="themeToggle" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="เปลี่ยนเป็นธีมสีดำ" title="สลับธีมสีขาว/สีดำ">
      <span class="theme-symbol sun" aria-hidden="true">☀</span>
      <span class="theme-symbol moon" aria-hidden="true">☾</span>
      <span class="theme-thumb" aria-hidden="true"></span>
    </button>
    <!-- ขออนุญาตเข้าถึง GPS ของอุปกรณ์ -->
    <button id="locateBtn" class="btn btn-location" type="button"><span aria-hidden="true">◎</span><span>ตำแหน่งของฉัน</span></button>
  </header>

  <!-- พื้นที่หลักของแอป แบ่งเป็นแถบรายการสถานที่กับแผนที่ -->
  <main class="app-main">
    <!-- แผงด้านข้าง: ปุ่มกรองหมวดหมู่ สถานะ และรายการสถานที่ -->
    <aside class="places-panel" id="placesPanel" aria-label="รายการสถานที่">
      <div class="panel-top">
        <div class="category-buttons" role="group" aria-label="กรองหมวดหมู่">
          <button class="category-btn active motorcycle" data-filter="motorcycle" type="button"><span aria-hidden="true">🛵</span> วินมอไซค์ <b>11</b></button>
          <button class="category-btn van" data-filter="van" type="button"><span aria-hidden="true">🚐</span> ท่ารถตู้ <b>1</b></button>
        </div>
        <button class="show-all-btn" id="showAllBtn" type="button" title="แสดงสถานที่ทั้งหมด">เลือกทั้งหมด</button>
      </div>
      <div class="results-heading"><span id="resultsTitle">สถานที่ทั้งหมด</span><span class="count-pill" id="resultsCount">12</span></div>
      <div id="statusMessage" class="status-message" role="status" aria-live="polite">เลือกสถานที่เพื่อดูตำแหน่งบนแผนที่</div>
      <div id="placesList" class="places-list"></div>
      <div class="panel-footer"><span class="legend-dot motorcycle-dot"></span> วินมอไซค์ <span class="legend-dot van-dot"></span> ท่ารถตู้</div>
    </aside>

    <!-- แผนที่จริง รวม legend และการ์ดรายละเอียดสถานที่ที่เลือก -->
    <section class="map-shell" aria-label="แผนที่มหาวิทยาลัยธรรมศาสตร์ ศูนย์รังสิต">
      <div id="map" role="application" aria-label="แผนที่แบบโต้ตอบ"></div>
      <div class="map-legend">
        <strong>คำอธิบายหมุด</strong>
        <div><span class="legend-dot motorcycle-dot"></span> วินมอไซค์</div>
        <div><span class="legend-dot van-dot"></span> ท่ารถตู้</div>
        <div><span class="legend-dot user-dot"></span> ตำแหน่งของคุณ</div>
      </div>
      <div class="selected-card" id="selectedCard" hidden>
        <div class="selected-icon" id="selectedIcon">🛵</div>
        <div class="selected-info"><strong id="selectedName"></strong><small id="selectedCategory"></small></div>
        <a id="directionsLink" class="directions-button" href="#" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> นำทาง</a>
        <button id="closeSelected" class="selected-close" type="button" aria-label="ปิดรายละเอียด">×</button>
      </div>
      <div class="map-help">แผนที่ © OpenStreetMap contributors · Leaflet</div>
    </section>
  </main>

  <!-- ปุ่มช่วยเปิด/ย่อรายการสถานที่บนหน้าจอมือถือ -->
  <div class="mobile-list-toggle">
    <button id="mobileListBtn" class="btn btn-primary" type="button">☷ รายการสถานที่</button>
  </div>
  <!-- พื้นที่แสดงข้อความแจ้งเตือนจาก JavaScript -->
  <div id="toast" class="app-toast" role="status" aria-live="polite"></div>

  <!-- Leaflet JavaScript: API สำหรับสร้างแผนที่และหมุด -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- โค้ดการทำงานของโปรเจกต์: แก้ข้อมูลสถานที่และฟังก์ชันใน app.js -->
  <script src="app.js"></script>
</body>
</html>
